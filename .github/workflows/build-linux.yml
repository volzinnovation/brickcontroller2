name: Build BrickController Linux

on:
  push:
    branches:
      - default
      - 'releases/**'
    paths:
      - '.github/**/*linux.yml'
      - 'build/installers/build-linux-deb.sh'
      - 'build/installers/build-linux-api-deb.sh'
      - 'Directory.*.props'
      - 'NuGet.config'
      - 'BrickController2.slnx'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.Linux/**'
      - 'BrickController2/BrickController2.Linux.Api/**'
  pull_request:
    branches:
      - default
      - 'releases/**'
    paths:
      - '.github/**/*linux.yml'
      - 'build/installers/build-linux-deb.sh'
      - 'build/installers/build-linux-api-deb.sh'
      - 'Directory.*.props'
      - 'NuGet.config'
      - 'BrickController2.slnx'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.Linux/**'
      - 'BrickController2/BrickController2.Linux.Api/**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    name: BrickController Linux API Build
    strategy:
      matrix:
        runtime: [linux-x64]
    env:
      APP_DISPLAY_VERSION: "0.0.0"

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui-android

    - name: Install packaging dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev

    - name: Set app version for release
      if: github.event_name == 'release' && github.event.action == 'published'
      run: echo "APP_DISPLAY_VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"

    - name: Build Linux API installer
      run: bash build/installers/build-linux-api-deb.sh ${{ matrix.runtime }}

    - name: Upload Linux API artifact
      uses: actions/upload-artifact@v4
      with:
        name: brickcontroller-linux-api-${{ matrix.runtime }}
        path: artifacts/installers/*.deb

    - name: Upload Linux API installer to release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/installers/*.deb
