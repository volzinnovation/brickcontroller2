<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">BrickController2 HTTP control flow</title>
  <desc id="desc">A client sends HTTP requests to the BrickController2 app, which controls a brick creation over Bluetooth.</desc>
  <!-- Original self-authored SVG icons; no third-party icon assets. -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#138a58"/>
    </marker>
    <filter id="soft-shadow" x="-14%" y="-16%" width="128%" height="136%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f1f35" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1100" height="300" rx="22" fill="#f7f9fc"/>

  <g id="client" transform="translate(48 48)">
    <rect x="0" y="0" width="270" height="204" rx="18" fill="#ffffff" stroke="#d7dee9" stroke-width="2" filter="url(#soft-shadow)"/>
    <g transform="translate(86 26)" fill="none" stroke="#2f6fed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="17" y="0" width="78" height="58" rx="9"/>
      <path d="M 0 86 H 112 L 94 58 H 18 Z" fill="#eaf1ff"/>
      <path d="M 41 23 L 29 34 L 41 45"/>
      <path d="M 71 23 L 83 34 L 71 45"/>
    </g>
    <text x="135" y="166" text-anchor="middle" fill="#182335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Client</text>
    <text x="135" y="192" text-anchor="middle" fill="#59677c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">third-party app</text>
  </g>

  <g id="server" transform="translate(415 48)">
    <rect x="0" y="0" width="270" height="204" rx="18" fill="#ffffff" stroke="#d7dee9" stroke-width="2" filter="url(#soft-shadow)"/>
    <g transform="translate(82 30)">
      <rect x="0" y="0" width="106" height="84" rx="15" fill="#fff1f1" stroke="#d71920" stroke-width="6"/>
      <path d="M 0 26 H 106" stroke="#d71920" stroke-width="6"/>
      <circle cx="21" cy="13" r="4.5" fill="#d71920"/>
      <circle cx="39" cy="13" r="4.5" fill="#d71920"/>
      <circle cx="57" cy="13" r="4.5" fill="#d71920"/>
      <path d="M 33 54 H 73 M 33 70 H 73" stroke="#d71920" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="135" y="166" text-anchor="middle" fill="#182335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">BrickController2</text>
    <text x="135" y="192" text-anchor="middle" fill="#59677c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">app and HTTP server</text>
  </g>

  <g id="creation" transform="translate(782 48)">
    <rect x="0" y="0" width="270" height="204" rx="18" fill="#ffffff" stroke="#d7dee9" stroke-width="2" filter="url(#soft-shadow)"/>
    <g transform="translate(73 20)">
      <rect x="0" y="36" width="124" height="48" rx="11" fill="#fff4db" stroke="#e09a18" stroke-width="6"/>
      <rect x="20" y="14" width="38" height="31" rx="8" fill="#fff4db" stroke="#e09a18" stroke-width="6"/>
      <rect x="72" y="14" width="38" height="31" rx="8" fill="#fff4db" stroke="#e09a18" stroke-width="6"/>
      <circle cx="35" cy="98" r="14" fill="#f4fbf8" stroke="#138a58" stroke-width="6"/>
      <circle cx="93" cy="98" r="14" fill="#f4fbf8" stroke="#138a58" stroke-width="6"/>
    </g>
    <text x="135" y="166" text-anchor="middle" fill="#182335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Brick creation</text>
    <text x="135" y="192" text-anchor="middle" fill="#59677c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">motors and lights</text>
  </g>

  <g id="http-arrow">
    <path d="M 342 150 H 390" fill="none" stroke="#2f6fed" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text x="366" y="125" text-anchor="middle" fill="#233044" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">HTTP</text>
  </g>

  <g id="bluetooth-arrow">
    <path d="M 709 150 H 757" fill="none" stroke="#138a58" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text x="733" y="125" text-anchor="middle" fill="#233044" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Bluetooth</text>
  </g>
</svg>
